{{define "styles"}}<style>
  :root { color-scheme: light dark; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width: 48rem;
    margin: 2rem auto;
    padding: 0 1rem;
    line-height: 1.5;
  }
  header nav { margin-bottom: 2rem; opacity: 0.8; font-size: 0.9rem; }
  header nav a { text-decoration: none; }
  h1 { margin-bottom: 0.25rem; }
  .meta { color: #888; font-size: 0.9rem; margin-bottom: 1.5rem; }
  .flash { padding: 0.75rem 1rem; border-radius: 0.5rem; background: rgba(64, 128, 255, 0.15); margin-bottom: 1.5rem; }
  .poll-list { list-style: none; padding: 0; }
  .poll-list li {
    padding: 0.75rem 0;
    border-bottom: 1px solid rgba(128, 128, 128, 0.25);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 1rem;
  }
  .phase {
    display: inline-block;
    padding: 0.1rem 0.5rem;
    border-radius: 999px;
    font-size: 0.75rem;
    text-transform: uppercase;
    background: rgba(128, 128, 128, 0.15);
  }
  .phase.open { background: rgba(64, 200, 128, 0.25); }
  .phase.closed { background: rgba(200, 96, 96, 0.25); }
  fieldset { border: 1px solid rgba(128, 128, 128, 0.35); border-radius: 0.5rem; margin: 1rem 0; padding: 1rem; }
  legend { padding: 0 0.5rem; font-weight: 600; }
  .results { list-style: none; padding: 0; margin: 0.25rem 0 0.75rem 0; }
  .results li {
    display: grid;
    grid-template-columns: 10rem 1fr 3rem;
    gap: 0.5rem;
    align-items: center;
    padding: 0.15rem 0;
  }
  .bar { height: 0.5rem; background: rgba(64, 128, 255, 0.35); border-radius: 999px; }
  button {
    padding: 0.5rem 1rem;
    border-radius: 0.5rem;
    border: 0;
    background: #4080ff;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  input[type=text], textarea {
    display: block;
    width: 100%;
    padding: 0.4rem;
    margin-top: 0.25rem;
    border-radius: 0.25rem;
    border: 1px solid rgba(128, 128, 128, 0.35);
    font: inherit;
    box-sizing: border-box;
  }
  label.choice { display: block; margin: 0.15rem 0; }
</style>{{end}}

{{define "nav"}}<header><nav><a href="/polls">← All polls</a></nav></header>{{end}}

{{define "flash"}}{{if .Flash}}<div class="flash">{{.Flash}}</div>{{end}}{{end}}
