---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: pollresponses.polls.jef.app
spec:
  group: polls.jef.app
  names:
    kind: PollResponse
    listKind: PollResponseList
    plural: pollresponses
    singular: pollresponse
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.pollRef.name
      name: Poll
      type: string
    - jsonPath: .spec.respondent
      name: Respondent
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1
    schema:
      openAPIV3Schema:
        description: PollResponse is the Schema for the pollresponses API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of PollResponse
            properties:
              answers:
                description: |-
                  answers holds one entry per question the voter is answering. Answers for
                  unknown questions cause the response to be rejected.
                items:
                  description: |-
                    PollAnswer holds a voter's answer to a single question.
                    Exactly one of selectedOptions or text must be set, matching the question type
                    defined on the referenced Poll.
                  properties:
                    questionID:
                      description: questionID matches the id of a question in the
                        referenced Poll's spec.questions.
                      maxLength: 63
                      minLength: 1
                      type: string
                    selectedOptions:
                      description: |-
                        selectedOptions lists the options chosen for a Choice question. It must
                        contain exactly one entry unless the question allows multiple choices.
                        Each entry must match one of the question's spec.choice.options values.
                      items:
                        type: string
                      maxItems: 20
                      type: array
                      x-kubernetes-list-type: atomic
                    text:
                      description: |-
                        text is the response for a FreeText question. Its length must not exceed
                        the question's spec.freeText.maxResponseLength.
                      maxLength: 10000
                      type: string
                  required:
                  - questionID
                  type: object
                maxItems: 50
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - questionID
                x-kubernetes-list-type: map
              pollRef:
                description: |-
                  pollRef identifies the Poll being answered. The Poll must exist in the
                  same namespace as this PollResponse.
                properties:
                  name:
                    description: name is the name of the Poll resource.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              respondent:
                description: |-
                  respondent is an opaque, caller-supplied identifier for the voter (for
                  example a username, email hash, or session id). It is stored as-is and
                  used only to deduplicate submissions when set.
                maxLength: 253
                type: string
              submittedAt:
                description: |-
                  submittedAt is the time the voter submitted this response. Defaults to the
                  object's creationTimestamp when unset.
                format: date-time
                type: string
            required:
            - answers
            - pollRef
            type: object
          status:
            description: status defines the observed state of PollResponse
            properties:
              acceptedAt:
                description: acceptedAt records when the response was accepted and
                  counted.
                format: date-time
                type: string
              conditions:
                description: |-
                  conditions represent the current state of the PollResponse resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Validated": the response was checked against the referenced Poll's schema
                  - "Counted":   the response has been included in the Poll's aggregated results

                  The status of each condition is one of True, False, or Unknown.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedPollGeneration:
                description: |-
                  observedPollGeneration is the metadata.generation of the referenced Poll
                  at the time this response was last validated. When the Poll's generation
                  advances, the response should be re-validated.
                format: int64
                type: integer
              phase:
                description: phase reports the validation lifecycle of the response.
                enum:
                - Pending
                - Accepted
                - Rejected
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
