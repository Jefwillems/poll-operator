# This rule is not used by the project poll-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the polls.jef.app.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: poll-operator
    app.kubernetes.io/managed-by: kustomize
  name: poll-editor-role
rules:
- apiGroups:
  - polls.jef.app
  resources:
  - polls
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - polls.jef.app
  resources:
  - polls/status
  verbs:
  - get
